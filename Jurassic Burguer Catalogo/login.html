<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurassic Burguer - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>Jurassic Burguer</h1>
        <nav>
            <a href="index.html">Menu</a>
            <a href="registro.html">Registrarse</a>
        </nav>
    </header>

    <main>
        
        <h2>Iniciar Sesion</h2>
        <form id="loginForm" onsubmit="return validarLogin()">
            <div>
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario" required>
            </div>
            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
        <p>¿No tienes cuenta? <a href="registro.html">Registrate aqui</a></p>
    </main>
    
    <script src="js/validaciones.js"></script> <!-- contiene validarLogin() -->
</body>

</html>
